name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: コアロジックのテスト
        run: npm test
      - name: 複数のタイムゾーンで確認
        run: npm run test:tz
